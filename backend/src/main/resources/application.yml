spring:
  application:
    name: zhuatech-ai-cases
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zhuatech_ai_cases?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:zhuatech}
    password: ${DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
zhuatech:
  ai:
    provider: ${ZHUATECH_AI_PROVIDER:local}
    base-url: ${ZHUATECH_AI_BASE_URL:https://api.deepseek.com}
    model: ${ZHUATECH_AI_MODEL:deepseek-chat}
    api-key: ${ZHUATECH_AI_API_KEY:}
